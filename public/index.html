<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥒 Pickleball Booking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0B1426;
      --bg2: #0f1e38;
      --card: #152742;
      --card2: #1a3058;
      --accent: #C8F031;
      --accent-dim: rgba(200, 240, 49, 0.1);
      --confirmed: #2ECC71;
      --confirmed-dim: rgba(46, 204, 113, 0.1);
      --tnd: #F5A623;
      --tnd-dim: rgba(245, 166, 35, 0.1);
      --danger: #E74C3C;
      --text: #EEF4FF;
      --text-muted: #7A96B5;
      --border: rgba(200, 240, 49, 0.18);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header & Navigation */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
    }

    .logo-svg {
      width: 32px;
      height: 32px;
    }

    nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    nav button {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    nav button:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    nav button.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Main Content */
    main {
      padding: 40px 20px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      margin-bottom: 60px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, #a8d82a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(200, 240, 49, 0.3);
    }

    .btn-secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--card);
      border-color: var(--accent);
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 14px;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: var(--border);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
    }

    .card-meta {
      display: flex;
      gap: 16px;
      margin: 12px 0;
      font-size: 14px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .card-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    .status-confirmed {
      background: var(--confirmed-dim);
      color: var(--confirmed);
    }

    .status-tnd {
      background: var(--tnd-dim);
      color: var(--tnd);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .grid.upcoming {
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }

    /* Next Event Card */
    .next-event-card {
      background: linear-gradient(135deg, var(--accent-dim), var(--card2));
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 40px;
      text-align: center;
    }

    .next-event-card.no-event {
      border-color: var(--border);
      background: var(--card);
    }

    .next-event-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .next-event-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .next-event-details {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 24px 0;
      flex-wrap: wrap;
    }

    .detail {
      text-align: center;
    }

    .detail-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    /* Stats Section */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Participants List */
    .participants-section {
      margin-top: 20px;
    }

    .participants-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .participants-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .participant-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--card2);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      font-size: 13px;
    }

    .participant-tag.confirmed {
      border-color: var(--confirmed-dim);
      background: var(--confirmed-dim);
    }

    .participant-tag.tnd {
      border-color: var(--tnd-dim);
      background: var(--tnd-dim);
    }

    /* Accordion */
    .accordion {
      margin-bottom: 16px;
    }

    .accordion-header {
      padding: 16px 20px;
      background: var(--card2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .accordion-header:hover {
      background: var(--card);
      border-color: var(--accent);
    }

    .accordion-header.active {
      background: var(--card);
      border-color: var(--accent);
    }

    .accordion-chevron {
      transition: transform 0.3s ease;
      font-size: 18px;
    }

    .accordion-header.active .accordion-chevron {
      transform: rotate(180deg);
    }

    .accordion-content {
      display: none;
      padding: 20px;
      background: var(--card);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-bottom-left-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
      margin-top: -1px;
    }

    .accordion-content.active {
      display: block;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      animation: fadeIn 0.3s ease;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text);
      font-size: 28px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease;
    }

    .modal-close:hover {
      color: var(--accent);
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      background: var(--bg2);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .form-buttons button {
      flex: 1;
    }

    /* Toast Notifications */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 16px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      z-index: 2000;
      animation: slideInRight 0.3s ease;
      max-width: 400px;
    }

    @keyframes slideInRight {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast.success {
      border-color: var(--confirmed);
      background: var(--confirmed-dim);
    }

    .toast.error {
      border-color: var(--danger);
      background: rgba(231, 76, 60, 0.1);
      color: var(--danger);
    }

    .toast.loading {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* Admin Section */
    .admin-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 40px;
    }

    .admin-panel-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .admin-password-form {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .admin-password-form input {
      flex: 1;
    }

    .admin-controls {
      background: var(--bg2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .admin-controls h3 {
      margin-bottom: 16px;
      color: var(--accent);
    }

    /* Loading State */
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--accent-dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 36px;
      }

      .hero-buttons {
        flex-direction: column;
      }

      .hero-buttons button {
        width: 100%;
      }

      .header-content {
        padding: 0 12px;
      }

      nav {
        gap: 4px;
      }

      nav button {
        padding: 6px 12px;
        font-size: 13px;
      }

      .next-event-details {
        gap: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .modal-content {
        padding: 24px;
      }

      .toast {
        right: 12px;
        left: 12px;
        max-width: none;
      }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    /* Flex utilities */
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .text-sm {
      font-size: 13px;
    }

    .text-muted {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <a href="#" class="logo" id="logoLink">
        <svg class="logo-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="#C8F031"/>
          <path d="M 20 50 Q 50 30 80 50 Q 50 70 20 50" fill="none" stroke="#0B1426" stroke-width="2.5" opacity="0.4"/>
          <circle cx="35" cy="38" r="4.5" fill="#0B1426" opacity="0.55"/>
          <circle cx="50" cy="32" r="4.5" fill="#0B1426" opacity="0.55"/>
          <circle cx="65" cy="38" r="4.5" fill="#0B1426" opacity="0.55"/>
          <circle cx="30" cy="52" r="4.5" fill="#0B1426" opacity="0.55"/>
          <circle cx="70" cy="52" r="4.5" fill="#0B1426" opacity="0.55"/>
          <circle cx="35" cy="65" r="4.5" fill="#0B1426" opacity="0.55"/>
          <circle cx="50" cy="70" r="4.5" fill="#0B1426" opacity="0.55"/>
          <circle cx="65" cy="65" r="4.5" fill="#0B1426" opacity="0.55"/>
          <circle cx="50" cy="50" r="4.5" fill="#0B1426" opacity="0.55"/>
        </svg>
        <span>Pickleball</span>
      </a>
      <nav>
        <button id="navHome" class="active">Home</button>
        <button id="navEvents">Events</button>
        <button id="navAdmin">Admin</button>
        <button id="navLogout" style="display: none;">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Home Section -->
    <section id="homeSection" class="section active">
      <div class="hero">
        <h1>🥒 Pickleball Booking</h1>
        <p>Find and join pickleball games near you</p>
        <div class="hero-buttons">
          <button class="btn btn-primary" id="browseEventsBtn">Browse Events</button>
          <button class="btn btn-secondary" id="createEventBtn">Create Event</button>
        </div>
      </div>

      <!-- Next Event Card -->
      <div class="next-event-card" id="nextEventCard">
        <div class="next-event-label">Next Event</div>
        <div class="next-event-title" id="nextEventTitle">No upcoming events</div>
        <div id="nextEventDetails" style="display: none;">
          <div class="next-event-details">
            <div class="detail">
              <div class="detail-label">Date</div>
              <div class="detail-value" id="nextEventDate"></div>
            </div>
            <div class="detail">
              <div class="detail-label">Time</div>
              <div class="detail-value" id="nextEventTime"></div>
            </div>
            <div class="detail">
              <div class="detail-label">Location</div>
              <div class="detail-value" id="nextEventLocation"></div>
            </div>
          </div>
          <button class="btn btn-primary btn-small" id="joinNextEventBtn">Join Event</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalEventsStat">0</div>
          <div class="stat-label">Total Events</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="upcomingStat">0</div>
          <div class="stat-label">Upcoming</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="pastStat">0</div>
          <div class="stat-label">Past</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="participantsStat">0</div>
          <div class="stat-label">Participants</div>
        </div>
      </div>
    </section>

    <!-- Events Section -->
    <section id="eventsSection" class="section">
      <h2 style="margin-bottom: 32px; font-size: 32px;">📅 Events</h2>

      <h3 style="margin-top: 40px; margin-bottom: 20px; color: var(--accent);">Upcoming Events</h3>
      <div class="grid upcoming" id="upcomingGrid"></div>

      <h3 style="margin-top: 40px; margin-bottom: 20px; color: var(--text-muted);">Past Events</h3>
      <div id="pastEventsAccordion"></div>
    </section>

    <!-- Admin Section -->
    <section id="adminSection" class="section">
      <div class="admin-panel">
        <div class="admin-panel-title">🔐 Admin Panel</div>

        <div id="adminLoginForm">
          <div class="form-group">
            <label>Admin Password</label>
            <div class="admin-password-form">
              <input type="password" id="adminPassword" placeholder="Enter admin password">
              <button class="btn btn-primary btn-small" id="adminLoginBtn">Login</button>
            </div>
          </div>
        </div>

        <div id="adminControls" style="display: none;">
          <div class="admin-controls">
            <h3>Event Management</h3>
            <button class="btn btn-primary" id="adminCreateEventBtn" style="width: 100%; margin-bottom: 12px;">Create New Event</button>
          </div>

          <div id="adminEventsList"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Create Event Modal -->
  <div id="createEventModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Create Event</h2>
        <button class="modal-close" id="createEventClose">&times;</button>
      </div>
      <form id="createEventForm">
        <div class="form-group">
          <label for="eventTitle">Event Title</label>
          <input type="text" id="eventTitle" required placeholder="e.g., Tuesday Pickup Game">
        </div>
        <div class="form-group">
          <label for="eventDate">Date</label>
          <input type="date" id="eventDate" required>
        </div>
        <div class="form-group">
          <label for="eventTime">Time</label>
          <input type="time" id="eventTime" required>
        </div>
        <div class="form-group">
          <label for="eventLocation">Location</label>
          <input type="text" id="eventLocation" required placeholder="e.g., Central Park Court 1">
        </div>
        <div class="form-group">
          <label for="maxPlayers">Max Players</label>
          <input type="number" id="maxPlayers" value="12" min="2" required>
        </div>
        <div class="form-group">
          <label for="eventDescription">Description (optional)</label>
          <textarea id="eventDescription" placeholder="e.g., All skill levels welcome!"></textarea>
        </div>
        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Create Event</button>
          <button type="button" class="btn btn-secondary" id="createEventCancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Join Event Modal -->
  <div id="joinEventModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Join Event</h2>
        <button class="modal-close" id="joinEventClose">&times;</button>
      </div>
      <div id="joinEventInfo" style="margin-bottom: 24px;">
        <p id="joinEventTitle" style="font-size: 18px; font-weight: 600; margin-bottom: 12px;"></p>
        <div class="card-meta">
          <div class="card-meta-item">📅 <span id="joinEventDate"></span></div>
          <div class="card-meta-item">🕐 <span id="joinEventTime"></span></div>
          <div class="card-meta-item">📍 <span id="joinEventLocation"></span></div>
        </div>
      </div>
      <form id="joinEventForm">
        <div class="form-group">
          <label for="participantName">Your Name</label>
          <input type="text" id="participantName" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label for="participantStatus">Status</label>
          <select id="participantStatus" required>
            <option value="confirmed">✓ Confirmed</option>
            <option value="tnd">? Tentative</option>
          </select>
        </div>
        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Join Event</button>
          <button type="button" class="btn btn-secondary" id="joinEventCancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Event Details Modal -->
  <div id="eventDetailsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="detailsEventTitle"></h2>
        <button class="modal-close" id="detailsEventClose">&times;</button>
      </div>
      <div id="eventDetailsContent">
        <!-- Populated by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Toasts Container -->
  <div id="toastsContainer"></div>

  <script>
    // ============ State Management ============
    let currentUser = null;
    let isAdmin = false;
    let allEvents = [];
    let nextEventToJoin = null;

    // ============ API Functions ============
    async function apiCall(endpoint, options = {}) {
      const method = options.method || 'GET';
      const body = options.body ? JSON.stringify(options.body) : undefined;

      try {
        const response = await fetch(endpoint, {
          method,
          headers: {
            'Content-Type': 'application/json',
          },
          body,
          credentials: 'include'
        });

        const data = await response.json();

        if (!response.ok && data.error) {
          throw new Error(data.error);
        }

        return data;
      } catch (error) {
        console.error('API Error:', error);
        throw error;
      }
    }

    async function getEvents() {
      const result = await apiCall('/api/events');
      return result.data || [];
    }

    async function getEvent(id) {
      const result = await apiCall(`/api/events/${id}`);
      return result.data;
    }

    async function createEvent(eventData) {
      const result = await apiCall('/api/events', {
        method: 'POST',
        body: eventData
      });
      return result.data;
    }

    async function deleteEvent(id) {
      const result = await apiCall(`/api/events/${id}`, {
        method: 'DELETE'
      });
      return result.data;
    }

    async function joinEvent(eventId, participantData) {
      const result = await apiCall(`/api/events/${eventId}/join`, {
        method: 'POST',
        body: participantData
      });
      return result.data;
    }

    async function removeParticipant(participantId) {
      const result = await apiCall(`/api/participants/${participantId}`, {
        method: 'DELETE'
      });
      return result.data;
    }

    async function loginAdmin(password) {
      const result = await apiCall('/api/admin/login', {
        method: 'POST',
        body: { password }
      });
      return result.data;
    }

    async function logoutAdmin() {
      const result = await apiCall('/api/admin/logout', {
        method: 'POST'
      });
      return result.data;
    }

    async function checkAdminStatus() {
      const result = await apiCall('/api/admin/check');
      return result.data.isAdmin;
    }

    async function getStats() {
      const result = await apiCall('/api/stats');
      return result.data;
    }

    // ============ UI Functions ============
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastsContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    function openModal(modalId) {
      document.getElementById(modalId).classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function formatTime(timeStr) {
      const [hours, minutes] = timeStr.split(':');
      const date = new Date(2000, 0, 1, hours, minutes);
      return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function getTodayDate() {
      const now = new Date();
      return now.toISOString().split('T')[0];
    }

    // ============ Page Navigation ============
    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');

      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
      if (sectionId === 'homeSection') {
        document.getElementById('navHome').classList.add('active');
      } else if (sectionId === 'eventsSection') {
        document.getElementById('navEvents').classList.add('active');
      } else if (sectionId === 'adminSection') {
        document.getElementById('navAdmin').classList.add('active');
      }
    }

    // ============ Render Functions ============
    async function renderHome() {
      try {
        allEvents = await getEvents();
        const upcoming = allEvents.filter(e => !e.isPast);
        const stats = await getStats();

        // Next Event
        if (upcoming.length > 0) {
          const nextEvent = upcoming[0];
          document.getElementById('nextEventTitle').textContent = nextEvent.title;
          document.getElementById('nextEventDate').textContent = formatDate(nextEvent.date);
          document.getElementById('nextEventTime').textContent = formatTime(nextEvent.time);
          document.getElementById('nextEventLocation').textContent = nextEvent.location;
          document.getElementById('nextEventDetails').style.display = 'block';
          document.getElementById('nextEventCard').classList.remove('no-event');
          nextEventToJoin = nextEvent;
        } else {
          document.getElementById('nextEventCard').classList.add('no-event');
          document.getElementById('nextEventDetails').style.display = 'none';
        }

        // Stats
        document.getElementById('totalEventsStat').textContent = stats.totalEvents;
        document.getElementById('upcomingStat').textContent = stats.upcomingCount;
        document.getElementById('pastStat').textContent = stats.pastCount;
        document.getElementById('participantsStat').textContent = stats.totalParticipants;
      } catch (error) {
        showToast('Failed to load home data: ' + error.message, 'error');
      }
    }

    function renderEventCard(event, isAdmin = false) {
      const card = document.createElement('div');
      card.className = 'card';
      
      const isFull = event.participant_count >= event.max_players;
      const statusText = isFull ? '🔴 Full' : `👥 ${event.max_players - event.participant_count} spots`;

      card.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-title">${event.title}</div>
            <span class="status-badge ${event.isPast ? 'status-tnd' : 'status-confirmed'}">
              ${event.isPast ? 'Past' : 'Upcoming'}
            </span>
          </div>
        </div>
        <div class="card-meta">
          <div class="card-meta-item">📅 ${formatDate(event.date)}</div>
          <div class="card-meta-item">🕐 ${formatTime(event.time)}</div>
          <div class="card-meta-item">📍 ${event.location}</div>
          <div class="card-meta-item">${statusText}</div>
        </div>
        ${event.description ? `<p style="margin-top: 12px; color: var(--text-muted); font-size: 14px;">${event.description}</p>` : ''}
        <div style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-secondary btn-small" data-event-id="${event.id}">View Details</button>
          ${!event.isPast && !isFull ? `<button class="btn btn-primary btn-small join-btn" data-event-id="${event.id}">Join</button>` : ''}
          ${isAdmin && !event.isPast ? `<button class="btn btn-danger btn-small delete-btn" data-event-id="${event.id}">Delete</button>` : ''}
        </div>
      `;

      card.querySelector('[data-event-id]').addEventListener('click', () => showEventDetails(event.id));
      
      const joinBtn = card.querySelector('.join-btn');
      if (joinBtn) {
        joinBtn.addEventListener('click', () => {
          nextEventToJoin = event;
          openModal('joinEventModal');
          document.getElementById('joinEventTitle').textContent = event.title;
          document.getElementById('joinEventDate').textContent = formatDate(event.date);
          document.getElementById('joinEventTime').textContent = formatTime(event.time);
          document.getElementById('joinEventLocation').textContent = event.location;
        });
      }

      const deleteBtn = card.querySelector('.delete-btn');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
          if (confirm('Delete this event?')) {
            try {
              await deleteEvent(event.id);
              showToast('Event deleted');
              renderEvents();
            } catch (error) {
              showToast('Failed to delete event: ' + error.message, 'error');
            }
          }
        });
      }

      return card;
    }

    async function renderEvents() {
      try {
        allEvents = await getEvents();
        const upcoming = allEvents.filter(e => !e.isPast);
        const past = allEvents.filter(e => e.isPast);

        const upcomingGrid = document.getElementById('upcomingGrid');
        upcomingGrid.innerHTML = '';
        if (upcoming.length === 0) {
          upcomingGrid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-state-icon">🏐</div><div class="empty-state-title">No Upcoming Events</div><p>Create or browse events to get started!</p></div>';
        } else {
          upcoming.forEach(e => upcomingGrid.appendChild(renderEventCard(e, isAdmin)));
        }

        const pastAccordion = document.getElementById('pastEventsAccordion');
        pastAccordion.innerHTML = '';
        if (past.length === 0) {
          pastAccordion.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📜</div><div class="empty-state-title">No Past Events</div></div>';
        } else {
          past.forEach((event, index) => {
            const accordion = document.createElement('div');
            accordion.className = 'accordion';

            const header = document.createElement('div');
            header.className = 'accordion-header';
            header.innerHTML = `
              <div>
                <div style="font-weight: 600;">${event.title}</div>
                <div style="font-size: 13px; color: var(--text-muted);">📅 ${formatDate(event.date)} • 👥 ${event.participant_count} players</div>
              </div>
              <span class="accordion-chevron">▼</span>
            `;

            const content = document.createElement('div');
            content.className = 'accordion-content';
            content.innerHTML = `
              <div style="margin-bottom: 16px;">
                <div class="text-sm text-muted">📍 ${event.location}</div>
                <div class="text-sm text-muted">🕐 ${formatTime(event.time)}</div>
                ${event.description ? `<p style="margin-top: 12px;">${event.description}</p>` : ''}
              </div>
              <div id="past-participants-${event.id}"></div>
            `;

            header.addEventListener('click', () => {
              header.classList.toggle('active');
              content.classList.toggle('active');
            });

            accordion.appendChild(header);
            accordion.appendChild(content);
            pastAccordion.appendChild(accordion);

            // Load participants
            getEvent(event.id).then(fullEvent => {
              const participantsDiv = document.getElementById(`past-participants-${event.id}`);
              if (fullEvent.participants.length > 0) {
                let html = '<div class="participants-header">Participants</div><div class="participants-list">';
                fullEvent.participants.forEach(p => {
                  html += `<div class="participant-tag ${p.status}">
                    ${p.status === 'confirmed' ? '✓' : '?'} ${p.name}
                  </div>`;
                });
                html += '</div>';
                participantsDiv.innerHTML = html;
              }
            });
          });
        }
      } catch (error) {
        showToast('Failed to load events: ' + error.message, 'error');
      }
    }

    async function showEventDetails(eventId) {
      try {
        const event = await getEvent(eventId);
        const modal = document.getElementById('eventDetailsModal');

        document.getElementById('detailsEventTitle').textContent = event.title;

        let html = `
          <div class="card-meta">
            <div class="card-meta-item">📅 ${formatDate(event.date)}</div>
            <div class="card-meta-item">🕐 ${formatTime(event.time)}</div>
            <div class="card-meta-item">📍 ${event.location}</div>
          </div>
        `;

        if (event.description) {
          html += `<p style="margin-top: 16px; margin-bottom: 16px;">${event.description}</p>`;
        }

        html += `
          <div class="participants-section">
            <div class="participants-header">Participants (${event.participants.length} / ${event.max_players})</div>
            <div class="participants-list">
        `;

        if (event.participants.length === 0) {
          html += '<p style="color: var(--text-muted);">No participants yet</p>';
        } else {
          event.participants.forEach(p => {
            html += `
              <div class="participant-tag ${p.status}">
                ${p.status === 'confirmed' ? '✓' : '?'} ${p.name}
                ${isAdmin ? `<button class="btn-icon" data-participant-id="${p.id}" style="background: none; border: none; color: inherit; cursor: pointer; font-size: 12px; margin-left: 4px;">×</button>` : ''}
              </div>
            `;
          });
        }

        html += '</div></div>';

        if (!event.isPast && event.participants.length < event.max_players) {
          html += `<button class="btn btn-primary" id="joinFromDetails" style="width: 100%; margin-top: 20px;">Join Event</button>`;
        }

        document.getElementById('eventDetailsContent').innerHTML = html;

        // Add event listeners for delete buttons
        document.querySelectorAll('[data-participant-id]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm('Remove this participant?')) {
              try {
                await removeParticipant(btn.dataset.participantId);
                showToast('Participant removed');
                showEventDetails(eventId);
              } catch (error) {
                showToast('Failed to remove participant: ' + error.message, 'error');
              }
            }
          });
        });

        const joinBtn = document.getElementById('joinFromDetails');
        if (joinBtn) {
          joinBtn.addEventListener('click', () => {
            closeModal('eventDetailsModal');
            nextEventToJoin = event;
            openModal('joinEventModal');
            document.getElementById('joinEventTitle').textContent = event.title;
            document.getElementById('joinEventDate').textContent = formatDate(event.date);
            document.getElementById('joinEventTime').textContent = formatTime(event.time);
            document.getElementById('joinEventLocation').textContent = event.location;
          });
        }

        openModal('eventDetailsModal');
      } catch (error) {
        showToast('Failed to load event details: ' + error.message, 'error');
      }
    }

    async function renderAdmin() {
      if (!isAdmin) {
        document.getElementById('adminLoginForm').style.display = 'block';
        document.getElementById('adminControls').style.display = 'none';
      } else {
        document.getElementById('adminLoginForm').style.display = 'none';
        document.getElementById('adminControls').style.display = 'block';

        try {
          allEvents = await getEvents();
          const adminEventsList = document.getElementById('adminEventsList');
          adminEventsList.innerHTML = '<h3 style="margin-top: 20px; margin-bottom: 16px;">Events</h3>';

          if (allEvents.length === 0) {
            adminEventsList.innerHTML += '<p style="color: var(--text-muted);">No events created yet</p>';
          } else {
            allEvents.forEach(event => {
              adminEventsList.appendChild(renderEventCard(event, true));
            });
          }
        } catch (error) {
          showToast('Failed to load admin data: ' + error.message, 'error');
        }
      }
    }

    // ============ Event Listeners ============
    document.getElementById('navHome').addEventListener('click', () => {
      showSection('homeSection');
      renderHome();
    });

    document.getElementById('navEvents').addEventListener('click', () => {
      showSection('eventsSection');
      renderEvents();
    });

    document.getElementById('navAdmin').addEventListener('click', () => {
      showSection('adminSection');
      renderAdmin();
    });

    document.getElementById('logoLink').addEventListener('click', (e) => {
      e.preventDefault();
      showSection('homeSection');
      renderHome();
    });

    document.getElementById('browseEventsBtn').addEventListener('click', () => {
      showSection('eventsSection');
      renderEvents();
    });

    document.getElementById('createEventBtn').addEventListener('click', () => {
      openModal('createEventModal');
    });

    document.getElementById('joinNextEventBtn').addEventListener('click', () => {
      openModal('joinEventModal');
      if (nextEventToJoin) {
        document.getElementById('joinEventTitle').textContent = nextEventToJoin.title;
        document.getElementById('joinEventDate').textContent = formatDate(nextEventToJoin.date);
        document.getElementById('joinEventTime').textContent = formatTime(nextEventToJoin.time);
        document.getElementById('joinEventLocation').textContent = nextEventToJoin.location;
      }
    });

    // Create Event Modal
    document.getElementById('createEventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;

      try {
        const eventData = {
          title: document.getElementById('eventTitle').value,
          date: document.getElementById('eventDate').value,
          time: document.getElementById('eventTime').value,
          location: document.getElementById('eventLocation').value,
          maxPlayers: parseInt(document.getElementById('maxPlayers').value),
          description: document.getElementById('eventDescription').value
        };

        await createEvent(eventData);
        showToast('Event created successfully!');
        closeModal('createEventModal');
        document.getElementById('createEventForm').reset();
        renderHome();
      } catch (error) {
        showToast('Failed to create event: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('createEventClose').addEventListener('click', () => closeModal('createEventModal'));
    document.getElementById('createEventCancel').addEventListener('click', () => closeModal('createEventModal'));

    // Join Event Modal
    document.getElementById('joinEventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;

      try {
        if (!nextEventToJoin) {
          throw new Error('No event selected');
        }

        const participantData = {
          name: document.getElementById('participantName').value,
          status: document.getElementById('participantStatus').value
        };

        await joinEvent(nextEventToJoin.id, participantData);
        showToast('Successfully joined event!');
        closeModal('joinEventModal');
        document.getElementById('joinEventForm').reset();
        renderHome();
      } catch (error) {
        showToast('Failed to join event: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('joinEventClose').addEventListener('click', () => closeModal('joinEventModal'));
    document.getElementById('joinEventCancel').addEventListener('click', () => closeModal('joinEventModal'));

    document.getElementById('detailsEventClose').addEventListener('click', () => closeModal('eventDetailsModal'));

    // Admin Login
    document.getElementById('adminLoginBtn').addEventListener('click', async () => {
      const password = document.getElementById('adminPassword').value;
      if (!password) {
        showToast('Please enter password', 'error');
        return;
      }

      try {
        await loginAdmin(password);
        isAdmin = true;
        showToast('Admin logged in');
        document.getElementById('adminPassword').value = '';
        document.getElementById('navLogout').style.display = 'block';
        renderAdmin();
      } catch (error) {
        showToast('Invalid password', 'error');
      }
    });

    document.getElementById('adminCreateEventBtn').addEventListener('click', () => {
      openModal('createEventModal');
    });

    document.getElementById('navLogout').addEventListener('click', async () => {
      try {
        await logoutAdmin();
        isAdmin = false;
        document.getElementById('navLogout').style.display = 'none';
        showToast('Logged out');
        showSection('homeSection');
        renderHome();
      } catch (error) {
        showToast('Logout failed: ' + error.message, 'error');
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal('createEventModal');
        closeModal('joinEventModal');
        closeModal('eventDetailsModal');
      }
    });

    // ============ Initialize ============
    async function init() {
      try {
        isAdmin = await checkAdminStatus();
        if (isAdmin) {
          document.getElementById('navLogout').style.display = 'block';
        }
        renderHome();
      } catch (error) {
        console.error('Initialization error:', error);
      }
    }

    init();

    // Set minimum date to today
    const today = getTodayDate();
    document.getElementById('eventDate').min = today;
  </script>
</body>
</html>
